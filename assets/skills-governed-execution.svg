<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Cyber-Sentinel Skills governed execution model</title>
  <desc id="desc">A governed cybersecurity skill moves from authorization and prerequisites through bounded execution, evidence, decision points, verification, and reusable outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120a22"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c084fc"/></marker>
  </defs>
  <rect width="1500" height="720" rx="30" fill="url(#bg)"/>
  <text x="750" y="70" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Governed Skill Execution</text>
  <text x="750" y="106" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="16">Repeatable security work with explicit authority, evidence, decision points, and stop conditions.</text>

  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(85 205)"><rect width="195" height="135" rx="22" fill="#21123d" stroke="#8b5cf6"/><text x="98" y="42" text-anchor="middle" fill="#f3e8ff" font-size="17" font-weight="700">Authorization</text><text x="98" y="68" text-anchor="middle" fill="#f3e8ff" font-size="17" font-weight="700">&amp; Scope</text><text x="98" y="103" text-anchor="middle" fill="#c4b5fd" font-size="12">Who may do what, where?</text></g>
    <g transform="translate(315 205)"><rect width="195" height="135" rx="22" fill="#21123d" stroke="#8b5cf6"/><text x="98" y="42" text-anchor="middle" fill="#f3e8ff" font-size="17" font-weight="700">Prerequisites</text><text x="98" y="68" text-anchor="middle" fill="#f3e8ff" font-size="17" font-weight="700">&amp; Inputs</text><text x="98" y="103" text-anchor="middle" fill="#c4b5fd" font-size="12">Access • evidence • tools</text></g>
    <g transform="translate(545 205)"><rect width="195" height="135" rx="22" fill="#21123d" stroke="#a855f7"/><text x="98" y="42" text-anchor="middle" fill="#f3e8ff" font-size="17" font-weight="700">Bounded</text><text x="98" y="68" text-anchor="middle" fill="#f3e8ff" font-size="17" font-weight="700">Procedure</text><text x="98" y="103" text-anchor="middle" fill="#c4b5fd" font-size="12">Steps • branches • limits</text></g>
    <g transform="translate(775 205)"><rect width="195" height="135" rx="22" fill="#18241f" stroke="#14b8a6"/><text x="98" y="42" text-anchor="middle" fill="#ccfbf1" font-size="17" font-weight="700">Evidence</text><text x="98" y="68" text-anchor="middle" fill="#ccfbf1" font-size="17" font-weight="700">&amp; Decisions</text><text x="98" y="103" text-anchor="middle" fill="#99f6e4" font-size="12">Observe • record • review</text></g>
    <g transform="translate(1005 205)"><rect width="195" height="135" rx="22" fill="#21123d" stroke="#8b5cf6"/><text x="98" y="42" text-anchor="middle" fill="#f3e8ff" font-size="17" font-weight="700">Verification</text><text x="98" y="68" text-anchor="middle" fill="#f3e8ff" font-size="17" font-weight="700">&amp; Exit</text><text x="98" y="103" text-anchor="middle" fill="#c4b5fd" font-size="12">Success • stop • escalate</text></g>
    <g transform="translate(1235 205)"><rect width="180" height="135" rx="22" fill="#21123d" stroke="#8b5cf6"/><text x="90" y="42" text-anchor="middle" fill="#f3e8ff" font-size="17" font-weight="700">Reusable</text><text x="90" y="68" text-anchor="middle" fill="#f3e8ff" font-size="17" font-weight="700">Outputs</text><text x="90" y="103" text-anchor="middle" fill="#c4b5fd" font-size="12">Artifacts • tickets • reports</text></g>
  </g>

  <g stroke="#c084fc" stroke-width="4" marker-end="url(#a)"><path d="M280 272 H307"/><path d="M510 272 H537"/><path d="M740 272 H767"/><path d="M970 272 H997"/><path d="M1200 272 H1227"/></g>

  <rect x="205" y="408" width="1090" height="128" rx="26" fill="#0f172a" stroke="#334155"/>
  <text x="750" y="448" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Human + AI execution boundary</text>
  <text x="750" y="481" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="14">AI may assist with bounded, declared operations. Authorization, destructive scope, evidence expectations, and escalation remain explicit.</text>
  <text x="750" y="508" text-anchor="middle" fill="#5eead4" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">No undeclared network • filesystem • shell • destructive side effects</text>

  <g font-family="Segoe UI,Arial,sans-serif" font-size="13">
    <rect x="260" y="595" width="190" height="46" rx="15" fill="#21123d" stroke="#6d28d9"/><text x="355" y="623" text-anchor="middle" fill="#e9d5ff">Purpose &amp; Scope</text>
    <rect x="470" y="595" width="190" height="46" rx="15" fill="#21123d" stroke="#6d28d9"/><text x="565" y="623" text-anchor="middle" fill="#e9d5ff">Safety Boundaries</text>
    <rect x="680" y="595" width="190" height="46" rx="15" fill="#21123d" stroke="#6d28d9"/><text x="775" y="623" text-anchor="middle" fill="#e9d5ff">Evidence Contract</text>
    <rect x="890" y="595" width="190" height="46" rx="15" fill="#21123d" stroke="#6d28d9"/><text x="985" y="623" text-anchor="middle" fill="#e9d5ff">Failure Conditions</text>
    <rect x="1100" y="595" width="160" height="46" rx="15" fill="#21123d" stroke="#6d28d9"/><text x="1180" y="623" text-anchor="middle" fill="#e9d5ff">Versioned</text>
  </g>
  <text x="750" y="680" text-anchor="middle" fill="#c084fc" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">A Skill is an operational contract — not a command list.</text>
</svg>